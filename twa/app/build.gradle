plugins {
    id 'com.android.application'
}

android {
    namespace 'com.repsandsteps.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.repsandsteps.app"
        // 21 is the floor for Trusted Web Activities.
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Google's TWA support library: launches the site in Chrome itself, so the
    // app shares Chrome's cookies and Google OAuth works normally.
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
